<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Rekap Order Bulanan - Villa Parfum</title>
    <link rel="stylesheet" href="style.css">
    <!-- SheetJS untuk manipulasi Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header>
            <h2>Villa Parfum - Rekap Permintaan Barang Bulanan</h2>
        </header>

        <!-- Panel Kontrol Utama -->
        <div class="card">
            <h3>1. Pengaturan Periode & Template Excel</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="selectBulan">Pilih Bulan Rekap:</label>
                    <select id="selectBulan">
                        <option value="0">Januari</option>
                        <option value="1">Februari</option>
                        <option value="2">Maret</option>
                        <option value="3">April</option>
                        <option value="4">Mei</option>
                        <option value="5">Juni</option>
                        <option value="6">Juli</option>
                        <option value="7">Agustus</option>
                        <option value="8">September</option>
                        <option value="9" selected>Oktober</option>
                        <option value="10">November</option>
                        <option value="11">Desember</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fileTemplate">Upload Template Excel Master:</label>
                    <input type="file" id="fileTemplate" accept=".xlsx, .xls">
                    <small>Upload file format Excel form rekap Anda.</small>
                </div>
            </div>
        </div>

        <!-- Panel Input Data -->
        <div class="card">
            <h3>2. Input Data Order / Permintaan</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="inputTanggal">Tanggal:</label>
                    <input type="date" id="inputTanggal">
                </div>
                <div class="form-group">
                    <label for="inputCabang">Nama Toko / Cabang:</label>
                    <input type="text" id="inputCabang" list="listCabang" placeholder="Ketik atau pilih toko...">
                    <datalist id="listCabang"></datalist>
                </div>
                <div class="form-group">
                    <label for="inputNominal">Nominal / Jumlah:</label>
                    <input type="number" id="inputNominal" placeholder="0">
                </div>
            </div>
            <button type="button" id="btnTambah" class="btn btn-success">Tambah ke Rekap</button>
        </div>

        <!-- Tabel Preview Data Masuk -->
        <div class="card">
            <h3>3. Preview Data Masuk</h3>
            <div class="table-responsive">
                <table id="tabelPreview">
                    <thead>
                        <tr>
                            <th>Tanggal</th>
                            <th>Cabang / Toko</th>
                            <th>Nominal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data dinamis masuk sini -->
                    </tbody>
                </table>
            </div>
        </div>

        <button type="button" id="btnExport" class="btn btn-primary btn-block">Download Rekap Excel</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
